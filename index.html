<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Домашний герой ⭐</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      color: #222;
    }

    header {
      text-align: center;
      padding: 25px 15px;
      background: #4f46e5;
      color: white;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    header p {
      margin: 0;
      opacity: 0.9;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .points-card {
      text-align: center;
    }

    .points {
      font-size: 52px;
      font-weight: bold;
      color: #4f46e5;
      margin: 10px 0;
    }

    .status {
      margin-top: 12px;
      padding: 13px;
      border-radius: 12px;
      font-weight: bold;
    }

    .allowed {
      background: #dcfce7;
      color: #166534;
    }

    .not-allowed {
      background: #fee2e2;
      color: #991b1b;
    }

    h2 {
      margin-top: 0;
    }

    .task {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.06);
    }

    .task-info {
      flex: 1;
    }

    .task-name {
      font-size: 17px;
      font-weight: bold;
    }

    .task-points {
      margin-top: 5px;
      color: #666;
    }

    .completed {
      opacity: 0.55;
    }

    .completed .task-name {
      text-decoration: line-through;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 11px 14px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .complete-btn {
      background: #4f46e5;
      color: white;
    }

    .complete-btn:disabled {
      background: #aaa;
    }

    .delete-btn {
      background: #fee2e2;
      color: #991b1b;
      margin-left: 5px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .add-btn {
      width: 100%;
      background: #16a34a;
      color: white;
    }

    .settings-btn {
      width: 100%;
      background: #f59e0b;
      color: white;
      margin-top: 5px;
    }

    .reset-btn {
      width: 100%;
      background: #ef4444;
      color: white;
      margin-top: 10px;
    }

    .parent-btn {
      width: 100%;
      background: #1f2937;
      color: white;
      margin-top: 15px;
    }

    .exit-btn {
      width: 100%;
      background: #6b7280;
      color: white;
      margin-top: 10px;
    }

    .small-text {
      color: #666;
      font-size: 14px;
      margin-bottom: 10px;
    }

    .empty {
      text-align: center;
      color: #777;
      padding: 20px;
    }

    .hidden {
      display: none;
    }

    .mode {
      text-align: center;
      margin-bottom: 15px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>🏠 Домашний герой</h1>
  <p>Выполняй задания — зарабатывай баллы ⭐</p>
</header>

<div class="container">

  <div id="modeText" class="mode">
    🦸 Режим ребёнка
  </div>

  <div class="card points-card">
    <div>Твои баллы</div>

    <div class="points">
      <span id="points">0</span> ⭐
    </div>

    <div id="status" class="status not-allowed">
      ⛔ Пока нельзя идти гулять
    </div>
  </div>

  <h2>📋 Задания</h2>

  <div id="tasks"></div>


  <!-- РОДИТЕЛЬСКАЯ ПАНЕЛЬ -->

  <div id="parentPanel" class="hidden">

    <div class="card">
      <h2>🎯 Правило прогулки</h2>

      <div class="small-text">
        Сколько баллов нужно набрать?
      </div>

      <input
        type="number"
        id="requiredPoints"
        min="1"
        placeholder="Например: 20"
      >

      <button
        class="settings-btn"
        onclick="saveRequiredPoints()"
      >
        💾 Сохранить правило
      </button>
    </div>


    <div class="card">
      <h2>➕ Добавить новое задание</h2>

      <input
        type="text"
        id="newTaskName"
        placeholder="Например: 🛏️ Заправить кровать"
      >

      <input
        type="number"
        id="newTaskPoints"
        placeholder="Сколько баллов?"
        min="1"
      >

      <button
        class="add-btn"
        onclick="addTask()"
      >
        ➕ Добавить задание
      </button>
    </div>


    <div class="card">
      <h2>🔐 Изменить PIN-код</h2>

      <input
        type="password"
        id="newPin"
        maxlength="10"
        placeholder="Новый PIN"
      >

      <button
        class="settings-btn"
        onclick="changePin()"
      >
        🔐 Сохранить PIN
      </button>
    </div>


    <button
      class="reset-btn"
      onclick="resetTasks()"
    >
      🔄 Сбросить все задания
    </button>


    <button
      class="exit-btn"
      onclick="exitParentMode()"
    >
      🚪 Выйти из режима родителя
    </button>

  </div>


  <!-- КНОПКА ВХОДА -->

  <button
    id="parentLoginBtn"
    class="parent-btn"
    onclick="enterParentMode()"
  >
    🔐 Войти как родитель
  </button>

</div>


<script>

const defaultTasks = [
  { name: "🧹 Убрать комнату", points: 10 },
  { name: "🍽️ Помыть посуду", points: 5 },
  { name: "🐕 Выгулять собаку", points: 10 },
  { name: "🧽 Помыть пол", points: 10 },
  { name: "🗑️ Вынести мусор", points: 5 }
];

let tasks =
  JSON.parse(localStorage.getItem("tasks")) ||
  defaultTasks;

let completedTasks =
  JSON.parse(localStorage.getItem("completedTasks")) ||
  [];

let requiredPoints =
  Number(localStorage.getItem("requiredPoints")) ||
  20;

let parentPin =
  localStorage.getItem("parentPin") ||
  "1234";

let parentMode = false;


document.getElementById("requiredPoints").value =
  requiredPoints;


function saveData() {

  localStorage.setItem(
    "tasks",
    JSON.stringify(tasks)
  );

  localStorage.setItem(
    "completedTasks",
    JSON.stringify(completedTasks)
  );

}


function renderTasks() {

  const container =
    document.getElementById("tasks");

  container.innerHTML = "";


  if (tasks.length === 0) {

    container.innerHTML =
      '<div class="empty">Пока нет заданий 👀</div>';

    updatePoints();

    return;

  }


  tasks.forEach((task, index) => {

    const completed =
      completedTasks.includes(index);


    const taskElement =
      document.createElement("div");


    taskElement.className =
      "task" + (completed ? " completed" : "");


    let buttons = `

      <button
        class="complete-btn"
        onclick="completeTask(${index})"
        ${completed ? "disabled" : ""}
      >
        ${completed ? "✅ Выполнено" : "Выполнить"}
      </button>

    `;


    if (parentMode) {

      buttons += `

        <button
          class="delete-btn"
          onclick="deleteTask(${index})"
        >
          🗑️
        </button>

      `;

    }


    taskElement.innerHTML = `

      <div class="task-info">

        <div class="task-name">
          ${task.name}
        </div>

        <div class="task-points">
          +${task.points} баллов ⭐
        </div>

      </div>

      <div>
        ${buttons}
      </div>

    `;


    container.appendChild(taskElement);

  });


  updatePoints();

}


function completeTask(index) {

  if (!completedTasks.includes(index)) {

    completedTasks.push(index);

    saveData();

    renderTasks();

  }

}


function enterParentMode() {

  const pin =
    prompt("Введите PIN-код родителя");


  if (pin === parentPin) {

    parentMode = true;


    document
      .getElementById("parentPanel")
      .classList.remove("hidden");


    document
      .getElementById("parentLoginBtn")
      .classList.add("hidden");


    document
      .getElementById("modeText")
      .textContent =
      "👨‍👩‍👧 Режим родителя";


    renderTasks();


  } else {

    alert("❌ Неверный PIN-код");

  }

}


function exitParentMode() {

  parentMode = false;


  document
    .getElementById("parentPanel")
    .classList.add("hidden");


  document
    .getElementById("parentLoginBtn")
    .classList.remove("hidden");


  document
    .getElementById("modeText")
    .textContent =
    "🦸 Режим ребёнка";


  renderTasks();

}


function addTask() {

  const name =
    document
      .getElementById("newTaskName")
      .value
      .trim();


  const points =
    Number(
      document
        .getElementById("newTaskPoints")
        .value
    );


  if (!name) {

    alert("Введите название задания");

    return;

  }


  if (!points || points < 1) {

    alert("Введите количество баллов");

    return;

  }


  tasks.push({
    name: name,
    points: points
  });


  saveData();


  document
    .getElementById("newTaskName")
    .value = "";


  document
    .getElementById("newTaskPoints")
    .value = "";


  renderTasks();

}


function deleteTask(index) {

  if (!parentMode) return;


  if (confirm("Удалить это задание?")) {

    tasks.splice(index, 1);


    completedTasks = [];


    saveData();


    renderTasks();

  }

}


function saveRequiredPoints() {

  const value =
    Number(
      document
        .getElementById("requiredPoints")
        .value
    );


  if (!value || value < 1) {

    alert("Введите правильное количество баллов");

    return;

  }


  requiredPoints = value;


  localStorage.setItem(
    "requiredPoints",
    requiredPoints
  );


  updatePoints();


  alert("Правило сохранено! 🎯");

}


function changePin() {

  const newPin =
    document
      .getElementById("newPin")
      .value
      .trim();


  if (newPin.length < 4) {

    alert("PIN должен содержать минимум 4 символа");

    return;

  }


  parentPin = newPin;


  localStorage.setItem(
    "parentPin",
    parentPin
  );


  document
    .getElementById("newPin")
    .value = "";


  alert("🔐 PIN-код изменён!");

}


function updatePoints() {

  let total = 0;


  completedTasks.forEach(index => {

    if (tasks[index]) {

      total += tasks[index].points;

    }

  });


  document
    .getElementById("points")
    .textContent = total;


  const status =
    document.getElementById("status");


  if (total >= requiredPoints) {

    status.className =
      "status allowed";


    status.innerHTML =
      "🎉 Можно идти гулять! Молодец!";

  } else {

    const remaining =
      requiredPoints - total;


    status.className =
      "status not-allowed";


    status.innerHTML =
      `⛔ Нужно ещё ${remaining} баллов для прогулки`;

  }

}


function resetTasks() {

  if (!parentMode) return;


  if (confirm("Сбросить все задания?")) {

    completedTasks = [];


    saveData();


    renderTasks();

  }

}


renderTasks();

</script>

</body>
</html>
